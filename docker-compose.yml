# docker-compose.yml —— 一条命令拉起“服务 + 数据库”
# ${...} 的值由 compose 自动从同目录 .env 里取，密码只写一处、两边共用
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.pg
    ports:
      - "8000:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PG_HOST: db
      PG_PASSWORD: ${PG_PASSWORD}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 注意：db 不写 ports —— 数据库只在内部网络里，不对外开放

volumes:
  pgdata:
