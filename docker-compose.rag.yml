services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.rag
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      PGVEC_PASSWORD: ${PGVEC_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${PGVEC_PASSWORD}
    volumes:
      - ragdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
volumes:
  ragdata:
